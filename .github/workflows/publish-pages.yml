name: Publish approved Pages files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [cisa-catalog-updated]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the artifact passes all checks
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deployable: ${{ steps.pages-source.outputs.deployable }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test the publishing rules
        run: python -m unittest discover -s .github/pages -p 'test_*.py'

      - name: Package and verify the approved files
        run: |
          python .github/pages/package.py build "$RUNNER_TEMP/approved-site"
          python .github/pages/package.py verify "$RUNNER_TEMP/approved-site"

      - name: Scan approved files for secrets
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks dir --redact=100 --no-banner --max-archive-depth=2 --max-decode-depth=2 approved-site

      - name: Check the Pages publishing source
        id: pages-source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source=$(curl --fail --silent --show-error --retry 3 --max-time 60 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            | python -c 'import json, sys; print(json.load(sys.stdin)["build_type"])')
          if [[ "$source" == workflow ]]; then
            echo 'deployable=true' >> "$GITHUB_OUTPUT"
          elif [[ "$source" == legacy ]]; then
            echo 'Pages still uses a branch source. This run will validate and upload the artifact but will not deploy it.'
            echo 'deployable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Could not establish the Pages publishing source.' >&2
            exit 1
          fi

      - name: Upload the scanned Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/approved-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
