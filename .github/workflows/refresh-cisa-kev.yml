# Public CISA data only. No workplace data or personal credentials are used.
# Changed snapshots are sent through the same Pages deployment gate as the website.
name: Refresh CISA KEV snapshot
on:
  workflow_dispatch:
  # Test the workflow when its configuration changes. Its own data-only
  # commit will not match this path and cannot cause a refresh loop.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-cisa-kev.yml'
  schedule:
    - cron: '17 17 * * *'
permissions:
  contents: write
jobs:
  refresh:
    # Manual runs can choose a branch; never push another branch into main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure base R is available
        run: |
          if ! command -v Rscript >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends r-base-core
          fi
      - name: Check the updater with offline fixtures
        run: Rscript --vanilla tests/cisa-kev-updater.test.R
      - name: Fetch and summarize the CISA catalog
        run: Rscript --vanilla cybersecurity/security-proposal-workspace/kev/update-kev.R --output cybersecurity/security-proposal-workspace/kev/snapshot.json
      - name: Commit only a changed snapshot
        id: snapshot
        run: |
          file=cybersecurity/security-proposal-workspace/kev/snapshot.json
          if git diff --quiet -- "$file"; then
            echo 'Catalog snapshot unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'Refresh CISA KEV snapshot'
          # No force: if main changed concurrently, the run fails safely.
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Queue the Pages deployment gate
        if: steps.snapshot.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=cisa-catalog-updated
